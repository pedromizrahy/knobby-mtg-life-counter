name: Pokemon engine checks
on:
  push:
    paths:
      - 'knobby/src/pokemon_progress.*'
      - 'tests/pokemon_progress_test.c'
      - 'tests/pokemon_reward_coordinator_test.c'
      - 'knobby/src/pokemon_reward_coordinator.*'
      - '.github/workflows/pokemon-engine.yml'
  pull_request:
    paths:
      - 'knobby/src/pokemon_progress.*'
      - 'tests/pokemon_progress_test.c'
      - '.github/workflows/pokemon-engine.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated Pokemon engine
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic knobby/src/pokemon_progress.c tests/pokemon_progress_test.c -o /tmp/pokemon_progress_test
      - name: Run reward and collection tests
        run: /tmp/pokemon_progress_test
      - name: Compile isolated reward crash-recovery tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic knobby/src/pokemon_progress.c knobby/src/pokemon_reward_coordinator.c tests/pokemon_reward_coordinator_test.c -o /tmp/pokemon_reward_test
      - name: Verify rewards never duplicate on simulated failures
        run: /tmp/pokemon_reward_test
