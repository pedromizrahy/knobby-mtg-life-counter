name: Pokemon engine checks
on:
  push:
    paths:
      - 'knobby/src/pokemon_progress.*'
      - 'tests/pokemon_progress_test.c'
      - 'tests/pokemon_reward_coordinator_test.c'
      - 'knobby/src/pokemon_reward_coordinator.*'
      - 'knobby/src/pokemon_reward_storage.*'
      - 'tests/pokemon_reward_storage_test.cpp'
      - 'tests/pokemon_profile_store_test.cpp'
      - 'tests/pokemon_mocks/Preferences.h'
      - 'knobby/src/pokemon_profile_store.*'
      - '.github/workflows/pokemon-engine.yml'
  pull_request:
    paths:
      - 'knobby/src/pokemon_progress.*'
      - 'tests/pokemon_progress_test.c'
      - '.github/workflows/pokemon-engine.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile isolated Pokemon engine
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic knobby/src/pokemon_progress.c tests/pokemon_progress_test.c -o /tmp/pokemon_progress_test
      - name: Run reward and collection tests
        run: /tmp/pokemon_progress_test
      - name: Compile isolated reward crash-recovery tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic knobby/src/pokemon_progress.c knobby/src/pokemon_reward_coordinator.c tests/pokemon_reward_coordinator_test.c -o /tmp/pokemon_reward_test
      - name: Verify rewards never duplicate on simulated failures
        run: /tmp/pokemon_reward_test
      - name: Build C transaction objects for C++ storage adapter
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -c knobby/src/pokemon_progress.c -o /tmp/pk_progress.o
          cc -std=c11 -Wall -Wextra -Werror -pedantic -c knobby/src/pokemon_reward_coordinator.c -o /tmp/pk_coordinator.o
      - name: Test storage adapter with simulated persistence
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic knobby/src/pokemon_reward_storage.cpp tests/pokemon_reward_storage_test.cpp /tmp/pk_progress.o /tmp/pk_coordinator.o -o /tmp/pokemon_storage_test
          /tmp/pokemon_storage_test
      - name: Test guarded NVS profile initialization with simulated Preferences
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic -Itests/pokemon_mocks knobby/src/pokemon_profile_store.cpp tests/pokemon_profile_store_test.cpp /tmp/pk_progress.o -o /tmp/pokemon_profile_store_test
          /tmp/pokemon_profile_store_test
